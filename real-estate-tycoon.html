<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Tycoon - Ultimate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } }
    @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .shake { animation: shake 0.5s ease-in-out; }
    .pulse-green { animation: pulse-green 1s ease-in-out; }
    .pulse-red { animation: pulse-red 1s ease-in-out; }
    .slide-in { animation: slideIn 0.3s ease-out; }
    .bounce { animation: bounce 0.3s ease-in-out; }
    .confetti { position: fixed; font-size: 2rem; animation: confetti 3s ease-out forwards; pointer-events: none; z-index: 1000; }
    .glow-gold { box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); }
    .rival-card { transition: all 0.3s; }
    .rival-card:hover { transform: scale(1.02); }
    .hot-property { animation: pulse-green 2s infinite; }
    .danger-zone { background: repeating-linear-gradient(45deg, #fef2f2, #fef2f2 10px, #fee2e2 10px, #fee2e2 20px); }
  </style>
</head>
<body class="bg-gray-900 min-h-screen text-white">
  <div id="app"></div>

  <script>
    // ==================== GAME CONFIGURATION ====================
    const CONFIG = {
      START_CASH: 150000,
      WIN_AMOUNT: 2000000,
      MAX_TURNS: 40,
      LOAN_INTEREST: 0.08,
      MAX_LOAN_MULTIPLIER: 2,
      AUCTION_CHANCE: 0.25,
      EVENT_CHANCE: 0.4,
      RIVAL_COUNT: 3,
    };

    // ==================== RIVALS ====================
    const RIVAL_TEMPLATES = [
      { name: 'Marcus Steel', emoji: '🦈', personality: 'aggressive', color: 'red', catchphrase: 'Money never sleeps!', strategy: 'Buys expensive properties, bids high' },
      { name: 'Olivia Chen', emoji: '🦊', personality: 'strategic', color: 'purple', catchphrase: 'Patience pays dividends.', strategy: 'Focuses on value, upgrades everything' },
      { name: 'Wild Card Willie', emoji: '🃏', personality: 'chaotic', color: 'yellow', catchphrase: 'Fortune favors the bold!', strategy: 'Unpredictable, takes big risks' },
      { name: 'Grandma Rose', emoji: '👵', personality: 'cautious', color: 'pink', catchphrase: 'Slow and steady, dear.', strategy: 'Only buys safe investments' },
    ];

    // ==================== NEIGHBORHOODS ====================
    const NEIGHBORHOODS = [
      { id: 'downtown', name: '🏙️ Downtown', riskLevel: 'medium', description: 'High traffic, steady appreciation', priceMultiplier: 1.2, rentMultiplier: 1.3 },
      { id: 'suburbs', name: '🏡 Suburbs', riskLevel: 'low', description: 'Safe bet, family-friendly', priceMultiplier: 1.0, rentMultiplier: 1.0 },
      { id: 'beachfront', name: '🏖️ Beachfront', riskLevel: 'high', description: 'Luxury area, volatile prices', priceMultiplier: 1.8, rentMultiplier: 1.5 },
      { id: 'industrial', name: '🏭 Industrial', riskLevel: 'medium', description: 'Commercial focus, high yields', priceMultiplier: 0.9, rentMultiplier: 1.4 },
    ];

    // ==================== PROPERTIES ====================
    const PROPERTY_TEMPLATES = [
      { name: 'Starter Shack', type: 'house', basePrice: 50000, baseRent: 500, emoji: '🏚️', tier: 1 },
      { name: 'Cozy Cottage', type: 'house', basePrice: 85000, baseRent: 750, emoji: '🏠', tier: 1 },
      { name: 'Family Home', type: 'house', basePrice: 150000, baseRent: 1200, emoji: '🏡', tier: 2 },
      { name: 'Studio Apartment', type: 'apartment', basePrice: 100000, baseRent: 900, emoji: '🏢', tier: 1 },
      { name: 'Luxury Loft', type: 'apartment', basePrice: 250000, baseRent: 2000, emoji: '🌆', tier: 2 },
      { name: 'Penthouse Suite', type: 'apartment', basePrice: 500000, baseRent: 4000, emoji: '✨', tier: 3 },
      { name: 'Corner Store', type: 'commercial', basePrice: 120000, baseRent: 1100, emoji: '🏪', tier: 1 },
      { name: 'Office Complex', type: 'commercial', basePrice: 350000, baseRent: 3000, emoji: '🏛️', tier: 2 },
      { name: 'Shopping Mall', type: 'commercial', basePrice: 800000, baseRent: 7000, emoji: '🛍️', tier: 3 },
      { name: 'Beach House', type: 'luxury', basePrice: 400000, baseRent: 3500, emoji: '🏖️', tier: 2 },
      { name: 'Mansion', type: 'luxury', basePrice: 750000, baseRent: 6000, emoji: '🏰', tier: 3 },
      { name: 'Skyscraper', type: 'luxury', basePrice: 1200000, baseRent: 10000, emoji: '🗼', tier: 3 },
    ];

    // ==================== UPGRADES ====================
    const UPGRADES = [
      { id: 'renovation', name: '🔨 Renovation', cost: 0.15, valueBoost: 1.25, rentBoost: 1.2, description: 'Fresh paint, new floors' },
      { id: 'smart-home', name: '🤖 Smart Home', cost: 0.1, valueBoost: 1.15, rentBoost: 1.15, description: 'IoT everything' },
      { id: 'pool', name: '🏊 Pool', cost: 0.2, valueBoost: 1.3, rentBoost: 1.25, description: 'Luxury amenity' },
      { id: 'solar', name: '☀️ Solar Panels', cost: 0.12, valueBoost: 1.1, rentBoost: 1.3, description: 'Green energy savings' },
      { id: 'security', name: '🔒 Security System', cost: 0.08, valueBoost: 1.1, rentBoost: 1.1, description: 'Peace of mind' },
    ];

    // ==================== EVENTS ====================
    const EVENTS = [
      { id: 'tech-boom', title: '💻 TECH BOOM!', description: 'A major tech company moved to town!', type: 'positive', effect: s => { s.ownedProperties.forEach(p => { p.currentPrice *= 1.2; p.rentIncome *= 1.15; }); return '+20% property values, +15% rent!'; } },
      { id: 'market-crash', title: '📉 MARKET CRASH!', description: 'Economic recession hits hard!', type: 'negative', effect: s => { s.ownedProperties.forEach(p => p.currentPrice *= 0.75); s.rivals.forEach(r => r.netWorth *= 0.8); return '-25% property values! Rivals hurt too.'; } },
      { id: 'gold-mine', title: '💰 GOLD DISCOVERED!', description: 'They found gold under your property!', type: 'jackpot', effect: s => { if(s.ownedProperties.length > 0) { const p = s.ownedProperties[Math.floor(Math.random()*s.ownedProperties.length)]; p.currentPrice *= 2; return `${p.name} doubled in value!`; } return 'No properties to benefit!'; } },
      { id: 'earthquake', title: '🌋 EARTHQUAKE!', description: 'A 6.5 magnitude quake shakes the city!', type: 'disaster', effect: s => { s.ownedProperties.forEach(p => { p.condition = Math.max(10, p.condition - 30); }); return 'All properties damaged! Repair needed.'; } },
      { id: 'celebrity', title: '⭐ CELEBRITY NEIGHBOR!', description: 'A famous celebrity bought next door!', type: 'positive', effect: s => { if(s.ownedProperties.length > 0) { const p = s.ownedProperties[Math.floor(Math.random()*s.ownedProperties.length)]; p.currentPrice *= 1.4; p.rentIncome *= 1.3; return `${p.name} is now famous! +40% value!`; } return 'No properties nearby!'; } },
      { id: 'crime-wave', title: '🚨 CRIME WAVE!', description: 'Crime rates spike in the area!', type: 'negative', effect: s => { s.ownedProperties.forEach(p => p.rentIncome *= 0.8); return '-20% rent income this turn!'; } },
      { id: 'inheritance', title: '👴 INHERITANCE!', description: 'A wealthy uncle left you money!', type: 'jackpot', effect: s => { const amount = 50000 + Math.floor(Math.random() * 100000); s.cash += amount; return `Received $${amount.toLocaleString()}!`; } },
      { id: 'lawsuit', title: '⚖️ LAWSUIT!', description: 'A tenant is suing you!', type: 'negative', effect: s => { const cost = Math.min(s.cash, 25000 + Math.floor(Math.random() * 25000)); s.cash -= cost; return `Legal fees: -$${cost.toLocaleString()}`; } },
      { id: 'viral', title: '📱 VIRAL LISTING!', description: 'Your property went viral on social media!', type: 'positive', effect: s => { if(s.ownedProperties.length > 0) { const p = s.ownedProperties[Math.floor(Math.random()*s.ownedProperties.length)]; p.currentPrice *= 1.5; return `${p.name} is internet famous! +50% value!`; } return 'Nothing to go viral!'; } },
      { id: 'tax-break', title: '📋 TAX BREAK!', description: 'Government incentives for property owners!', type: 'positive', effect: s => { const bonus = s.ownedProperties.length * 5000; s.cash += bonus; return `Received $${bonus.toLocaleString()} in tax credits!`; } },
      { id: 'bidding-war', title: '🔥 BIDDING WAR!', description: 'Multiple buyers want your property!', type: 'positive', effect: s => { if(s.ownedProperties.length > 0) { const p = s.ownedProperties[Math.floor(Math.random()*s.ownedProperties.length)]; const offer = Math.round(p.currentPrice * 1.5); s.pendingOffer = { property: p, amount: offer }; return `Someone offered $${offer.toLocaleString()} for ${p.name}!`; } return 'No properties to sell!'; } },
      { id: 'renovation-show', title: '📺 TV RENOVATION!', description: 'A TV show wants to renovate for free!', type: 'jackpot', effect: s => { if(s.ownedProperties.length > 0) { const worst = s.ownedProperties.reduce((a,b) => a.condition < b.condition ? a : b); worst.condition = 100; worst.currentPrice *= 1.3; worst.upgrades = worst.upgrades || []; worst.upgrades.push('renovation'); return `${worst.name} fully renovated for FREE!`; } return 'No properties to renovate!'; } },
    ];

    // ==================== ACHIEVEMENTS ====================
    const ACHIEVEMENTS = [
      { id: 'first-buy', name: '🔑 First Keys', description: 'Buy your first property', check: s => s.ownedProperties.length >= 1 },
      { id: 'landlord', name: '🏠 Landlord', description: 'Own 3 properties', check: s => s.ownedProperties.length >= 3 },
      { id: 'tycoon', name: '👔 Tycoon', description: 'Own 5 properties', check: s => s.ownedProperties.length >= 5 },
      { id: 'mogul', name: '🎩 Mogul', description: 'Own 8 properties', check: s => s.ownedProperties.length >= 8 },
      { id: 'flipper', name: '🔄 House Flipper', description: 'Sell a property for 50%+ profit', check: s => s.stats.bestFlip >= 50 },
      { id: 'master-flipper', name: '💎 Master Flipper', description: 'Sell a property for 100%+ profit', check: s => s.stats.bestFlip >= 100 },
      { id: 'risk-taker', name: '🎲 Risk Taker', description: 'Take out a loan over $200k', check: s => s.stats.maxLoan >= 200000 },
      { id: 'debt-free', name: '🆓 Debt Free', description: 'Pay off a loan completely', check: s => s.stats.loansPaid >= 1 },
      { id: 'survivor', name: '🛡️ Survivor', description: 'Survive a market crash', check: s => s.stats.crashesSurvived >= 1 },
      { id: 'diversified', name: '📊 Diversified', description: 'Own properties in all neighborhoods', check: s => new Set(s.ownedProperties.map(p => p.neighborhood)).size >= 4 },
      { id: 'upgrader', name: '⬆️ Upgrader', description: 'Fully upgrade a property', check: s => s.ownedProperties.some(p => (p.upgrades?.length || 0) >= 3) },
      { id: 'millionaire', name: '💵 Millionaire', description: 'Reach $1M net worth', check: s => s.netWorth >= 1000000 },
      { id: 'rival-crusher', name: '👑 Rival Crusher', description: 'Have higher net worth than all rivals', check: s => s.rivals.every(r => s.netWorth > r.netWorth) },
    ];

    // ==================== GAME STATE ====================
    let game = null;

    function createNewGame() {
      const rivals = RIVAL_TEMPLATES.slice(0, CONFIG.RIVAL_COUNT).map(r => ({
        ...r,
        cash: CONFIG.START_CASH,
        netWorth: CONFIG.START_CASH,
        properties: [],
        mood: 'neutral',
      }));

      return {
        cash: CONFIG.START_CASH,
        loan: 0,
        loanTurnsRemaining: 0,
        ownedProperties: [],
        availableProperties: [],
        turn: 1,
        netWorth: CONFIG.START_CASH,
        rivals: rivals,
        currentEvent: null,
        pendingOffer: null,
        auction: null,
        gameStatus: 'playing',
        message: null,
        notifications: [],
        achievements: [],
        stats: { bestFlip: 0, maxLoan: 0, loansPaid: 0, crashesSurvived: 0, propertiesBought: 0, propertiesSold: 0 },
        selectedNeighborhood: 'all',
      };
    }

    // ==================== HELPER FUNCTIONS ====================
    function genId() { return Math.random().toString(36).substr(2, 9); }

    function notify(msg, type = 'info') {
      game.notifications.unshift({ id: genId(), msg, type, time: Date.now() });
      if (game.notifications.length > 5) game.notifications.pop();
    }

    function generateProperty() {
      const template = PROPERTY_TEMPLATES[Math.floor(Math.random() * PROPERTY_TEMPLATES.length)];
      const neighborhood = NEIGHBORHOODS[Math.floor(Math.random() * NEIGHBORHOODS.length)];
      const variance = 0.8 + Math.random() * 0.4;
      const condition = 50 + Math.floor(Math.random() * 50);

      return {
        id: genId(),
        ...template,
        neighborhood: neighborhood.id,
        neighborhoodData: neighborhood,
        currentPrice: Math.round(template.basePrice * neighborhood.priceMultiplier * variance),
        rentIncome: Math.round(template.baseRent * neighborhood.rentMultiplier * variance),
        condition: condition,
        upgrades: [],
        turnsOwned: 0,
        purchasePrice: 0,
        isHot: Math.random() < 0.15,
      };
    }

    function generateMarket(count = 6) {
      return Array(count).fill(null).map(() => generateProperty());
    }

    function calculateNetWorth(entity) {
      const propertyValue = (entity.ownedProperties || entity.properties || []).reduce((sum, p) => sum + p.currentPrice, 0);
      return (entity.cash || 0) + propertyValue - (entity.loan || 0);
    }

    function checkAchievements() {
      ACHIEVEMENTS.forEach(ach => {
        if (!game.achievements.includes(ach.id) && ach.check(game)) {
          game.achievements.push(ach.id);
          notify(`🏆 Achievement: ${ach.name}!`, 'achievement');
        }
      });
    }

    function spawnConfetti() {
      const emojis = ['🎉', '🎊', '✨', '💰', '🏆', '⭐'];
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-50px';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3000);
        }, i * 100);
      }
    }

    // ==================== RIVAL AI ====================
    function rivalTakeTurn(rival) {
      const actions = [];

      // Collect rent
      let rent = 0;
      rival.properties.forEach(p => {
        rent += Math.round(p.rentIncome * (p.condition / 100));
        p.condition = Math.max(10, p.condition - 2);
        p.turnsOwned++;
      });
      rival.cash += rent;
      if (rent > 0) actions.push(`collected $${rent.toLocaleString()} rent`);

      // Decide to buy
      const affordableProperties = game.availableProperties.filter(p => p.currentPrice <= rival.cash * 0.8);

      if (affordableProperties.length > 0 && Math.random() < 0.6) {
        let target = null;

        switch (rival.personality) {
          case 'aggressive':
            target = affordableProperties.reduce((a, b) => a.currentPrice > b.currentPrice ? a : b);
            break;
          case 'strategic':
            target = affordableProperties.reduce((a, b) => (a.rentIncome / a.currentPrice) > (b.rentIncome / b.currentPrice) ? a : b);
            break;
          case 'cautious':
            target = affordableProperties.filter(p => p.tier === 1).sort((a, b) => a.currentPrice - b.currentPrice)[0];
            break;
          case 'chaotic':
            target = affordableProperties[Math.floor(Math.random() * affordableProperties.length)];
            break;
        }

        if (target) {
          rival.cash -= target.currentPrice;
          target.purchasePrice = target.currentPrice;
          rival.properties.push(target);
          game.availableProperties = game.availableProperties.filter(p => p.id !== target.id);
          actions.push(`bought ${target.name}`);
          rival.mood = 'happy';
        }
      }

      // Sometimes sell
      if (rival.properties.length > 0 && Math.random() < 0.2) {
        const profitable = rival.properties.filter(p => p.currentPrice > p.purchasePrice * 1.3);
        if (profitable.length > 0) {
          const toSell = profitable[0];
          rival.cash += toSell.currentPrice;
          rival.properties = rival.properties.filter(p => p.id !== toSell.id);
          actions.push(`sold ${toSell.name}`);
        }
      }

      rival.netWorth = calculateNetWorth(rival);

      if (actions.length > 0) {
        notify(`${rival.emoji} ${rival.name} ${actions.join(', ')}`, 'rival');
      }
    }

    // ==================== GAME ACTIONS ====================
    function buyProperty(propertyId) {
      const property = game.availableProperties.find(p => p.id === propertyId);
      if (!property) return;

      const totalFunds = game.cash;
      if (totalFunds < property.currentPrice) {
        notify("💸 Can't afford this! Take a loan?", 'error');
        return;
      }

      game.cash -= property.currentPrice;
      property.purchasePrice = property.currentPrice;
      property.turnsOwned = 0;
      game.ownedProperties.push(property);
      game.availableProperties = game.availableProperties.filter(p => p.id !== propertyId);
      game.stats.propertiesBought++;

      notify(`🔑 Bought ${property.name} for $${property.currentPrice.toLocaleString()}!`, 'success');
      updateNetWorth();
      checkAchievements();
      render();
    }

    function sellProperty(propertyId) {
      const property = game.ownedProperties.find(p => p.id === propertyId);
      if (!property) return;

      const profit = property.currentPrice - property.purchasePrice;
      const profitPercent = Math.round((profit / property.purchasePrice) * 100);

      game.cash += property.currentPrice;
      game.ownedProperties = game.ownedProperties.filter(p => p.id !== propertyId);
      game.stats.propertiesSold++;
      game.stats.bestFlip = Math.max(game.stats.bestFlip, profitPercent);

      const emoji = profit >= 0 ? '📈' : '📉';
      notify(`${emoji} Sold ${property.name}! ${profit >= 0 ? 'Profit' : 'Loss'}: $${Math.abs(profit).toLocaleString()} (${profitPercent >= 0 ? '+' : ''}${profitPercent}%)`, profit >= 0 ? 'success' : 'error');

      updateNetWorth();
      checkAchievements();
      render();
    }

    function upgradeProperty(propertyId, upgradeId) {
      const property = game.ownedProperties.find(p => p.id === propertyId);
      const upgrade = UPGRADES.find(u => u.id === upgradeId);
      if (!property || !upgrade) return;
      if (property.upgrades?.includes(upgradeId)) return;

      const cost = Math.round(property.currentPrice * upgrade.cost);
      if (game.cash < cost) {
        notify("💸 Can't afford this upgrade!", 'error');
        return;
      }

      game.cash -= cost;
      property.upgrades = property.upgrades || [];
      property.upgrades.push(upgradeId);
      property.currentPrice = Math.round(property.currentPrice * upgrade.valueBoost);
      property.rentIncome = Math.round(property.rentIncome * upgrade.rentBoost);

      notify(`⬆️ Upgraded ${property.name} with ${upgrade.name}!`, 'success');
      updateNetWorth();
      checkAchievements();
      render();
    }

    function repairProperty(propertyId) {
      const property = game.ownedProperties.find(p => p.id === propertyId);
      if (!property) return;

      const repairCost = Math.round((100 - property.condition) * property.currentPrice * 0.003);
      if (game.cash < repairCost) {
        notify("💸 Can't afford repairs!", 'error');
        return;
      }

      game.cash -= repairCost;
      property.condition = 100;
      notify(`🔧 Repaired ${property.name} for $${repairCost.toLocaleString()}!`, 'success');
      updateNetWorth();
      render();
    }

    function takeLoan(amount) {
      const maxLoan = game.netWorth * CONFIG.MAX_LOAN_MULTIPLIER;
      if (game.loan + amount > maxLoan) {
        notify(`🏦 Maximum loan is $${Math.round(maxLoan).toLocaleString()}!`, 'error');
        return;
      }

      game.loan += amount;
      game.cash += amount;
      game.loanTurnsRemaining = 10;
      game.stats.maxLoan = Math.max(game.stats.maxLoan, game.loan);

      notify(`🏦 Took out $${amount.toLocaleString()} loan! Pay it back in 10 turns.`, 'warning');
      updateNetWorth();
      checkAchievements();
      render();
    }

    function payLoan(amount) {
      const payment = Math.min(amount, game.loan, game.cash);
      if (payment <= 0) return;

      game.cash -= payment;
      game.loan -= payment;

      if (game.loan <= 0) {
        game.loan = 0;
        game.loanTurnsRemaining = 0;
        game.stats.loansPaid++;
        notify('🎉 Loan fully paid off!', 'success');
      } else {
        notify(`💳 Paid $${payment.toLocaleString()} towards loan.`, 'info');
      }

      updateNetWorth();
      checkAchievements();
      render();
    }

    function acceptOffer() {
      if (!game.pendingOffer) return;
      const { property, amount } = game.pendingOffer;

      game.cash += amount;
      game.ownedProperties = game.ownedProperties.filter(p => p.id !== property.id);

      const profit = amount - property.purchasePrice;
      game.stats.bestFlip = Math.max(game.stats.bestFlip, Math.round((profit / property.purchasePrice) * 100));

      notify(`💰 Sold ${property.name} for $${amount.toLocaleString()}!`, 'success');
      game.pendingOffer = null;
      updateNetWorth();
      checkAchievements();
      render();
    }

    function declineOffer() {
      notify('❌ Declined the offer.', 'info');
      game.pendingOffer = null;
      render();
    }

    function placeBid(amount) {
      if (!game.auction || game.cash < amount) return;

      game.auction.playerBid = amount;

      // Rivals decide to counter-bid
      game.auction.rivalBids = game.rivals.map(rival => {
        if (rival.cash < amount * 1.1) return { rival, bid: 0, out: true };

        let bidChance = 0.5;
        if (rival.personality === 'aggressive') bidChance = 0.8;
        if (rival.personality === 'cautious') bidChance = 0.2;
        if (rival.personality === 'chaotic') bidChance = Math.random();

        if (Math.random() < bidChance && rival.cash >= amount * 1.1) {
          const newBid = Math.round(amount * (1.05 + Math.random() * 0.15));
          return { rival, bid: Math.min(newBid, rival.cash), out: false };
        }
        return { rival, bid: 0, out: true };
      });

      const activeBids = game.auction.rivalBids.filter(b => !b.out);
      const highestRivalBid = activeBids.length > 0 ? Math.max(...activeBids.map(b => b.bid)) : 0;

      if (highestRivalBid > amount) {
        const winner = activeBids.find(b => b.bid === highestRivalBid);
        notify(`${winner.rival.emoji} ${winner.rival.name} outbid you with $${highestRivalBid.toLocaleString()}!`, 'rival');
        winner.rival.cash -= highestRivalBid;
        game.auction.property.purchasePrice = highestRivalBid;
        winner.rival.properties.push(game.auction.property);
        winner.rival.netWorth = calculateNetWorth(winner.rival);
      } else {
        // Player wins!
        game.cash -= amount;
        game.auction.property.purchasePrice = amount;
        game.ownedProperties.push(game.auction.property);
        game.stats.propertiesBought++;
        notify(`🎉 You won the auction for $${amount.toLocaleString()}!`, 'success');
        spawnConfetti();
      }

      game.availableProperties = game.availableProperties.filter(p => p.id !== game.auction.property.id);
      game.auction = null;
      updateNetWorth();
      checkAchievements();
      render();
    }

    function skipAuction() {
      notify('👋 Skipped the auction.', 'info');
      // A rival might buy it
      const interestedRival = game.rivals.find(r => r.cash >= game.auction.property.currentPrice);
      if (interestedRival && Math.random() < 0.5) {
        interestedRival.cash -= game.auction.property.currentPrice;
        game.auction.property.purchasePrice = game.auction.property.currentPrice;
        interestedRival.properties.push(game.auction.property);
        interestedRival.netWorth = calculateNetWorth(interestedRival);
        game.availableProperties = game.availableProperties.filter(p => p.id !== game.auction.property.id);
        notify(`${interestedRival.emoji} ${interestedRival.name} bought it instead!`, 'rival');
      }
      game.auction = null;
      render();
    }

    function updateNetWorth() {
      game.netWorth = calculateNetWorth(game);
    }

    function nextTurn() {
      if (game.gameStatus !== 'playing') return;

      // Collect rent
      let totalRent = 0;
      game.ownedProperties.forEach(p => {
        const effectiveRent = Math.round(p.rentIncome * (p.condition / 100));
        totalRent += effectiveRent;
        p.condition = Math.max(10, p.condition - 3);
        p.turnsOwned++;
      });
      game.cash += totalRent;
      if (totalRent > 0) notify(`💰 Collected $${totalRent.toLocaleString()} in rent!`, 'success');

      // Loan interest
      if (game.loan > 0) {
        const interest = Math.round(game.loan * CONFIG.LOAN_INTEREST);
        game.cash -= interest;
        game.loanTurnsRemaining--;
        notify(`🏦 Loan interest: -$${interest.toLocaleString()}`, 'warning');

        if (game.loanTurnsRemaining <= 0 && game.loan > 0) {
          if (game.cash >= game.loan) {
            game.cash -= game.loan;
            notify(`🏦 Loan auto-repaid: -$${game.loan.toLocaleString()}`, 'warning');
            game.loan = 0;
            game.stats.loansPaid++;
          } else {
            // Forced to sell!
            notify('🚨 LOAN DEFAULT! Forced to sell property!', 'error');
            if (game.ownedProperties.length > 0) {
              const toSell = game.ownedProperties[0];
              game.cash += Math.round(toSell.currentPrice * 0.7); // Penalty
              game.ownedProperties.shift();
            }
            game.loan = Math.max(0, game.loan - game.cash);
            game.cash = Math.max(0, game.cash - game.loan);
          }
        }
      }

      // Market fluctuation
      game.availableProperties.forEach(p => {
        const change = 0.95 + Math.random() * 0.1;
        p.currentPrice = Math.round(p.currentPrice * change);
      });
      game.ownedProperties.forEach(p => {
        const change = 0.97 + Math.random() * 0.06;
        p.currentPrice = Math.round(p.currentPrice * change);
      });

      // Rivals take turns
      game.rivals.forEach(rival => rivalTakeTurn(rival));

      // Refresh market
      const keepCount = Math.min(3, game.availableProperties.length);
      game.availableProperties = [
        ...game.availableProperties.slice(0, keepCount),
        ...generateMarket(6 - keepCount)
      ];

      // Random event
      if (Math.random() < CONFIG.EVENT_CHANCE) {
        const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
        game.currentEvent = event;
        const result = event.effect(game);
        game.currentEvent.result = result;
        if (event.id === 'market-crash') game.stats.crashesSurvived++;
      }

      // Auction chance
      if (!game.currentEvent && Math.random() < CONFIG.AUCTION_CHANCE) {
        const hotProperty = generateProperty();
        hotProperty.isHot = true;
        hotProperty.currentPrice = Math.round(hotProperty.currentPrice * 0.85); // Starting price discount
        game.auction = {
          property: hotProperty,
          playerBid: 0,
          rivalBids: [],
          minBid: hotProperty.currentPrice,
        };
        game.availableProperties.push(hotProperty);
      }

      game.turn++;
      updateNetWorth();
      checkAchievements();

      // Win/lose check
      if (game.netWorth >= CONFIG.WIN_AMOUNT) {
        game.gameStatus = 'won';
        spawnConfetti();
      } else if (game.netWorth <= 0 && game.ownedProperties.length === 0) {
        game.gameStatus = 'lost';
      } else if (game.turn > CONFIG.MAX_TURNS) {
        const playerRank = game.rivals.filter(r => r.netWorth > game.netWorth).length + 1;
        game.gameStatus = playerRank === 1 ? 'won' : 'lost';
        game.finalRank = playerRank;
        if (playerRank === 1) spawnConfetti();
      }

      render();
    }

    function dismissEvent() {
      game.currentEvent = null;
      render();
    }

                  <div>
                    <div class="text-sm text-gray-400">Final Net Worth</div>
                    <div class="text-2xl font-black text-green-400">$${game.netWorth.toLocaleString()}</div>
                  </div>
                  <div>
                    <div class="text-sm text-gray-400">Final Rank</div>
                    <div class="text-2xl font-black">#${game.finalRank || (game.gameStatus === 'won' ? 1 : 4)}</div>
                  </div>
                  <div>
                    <div class="text-sm text-gray-400">Properties Owned</div>
                    <div class="text-2xl font-black">${game.ownedProperties.length}</div>
                  </div>
                  <div>
                    <div class="text-sm text-gray-400">Achievements</div>
                    <div class="text-2xl font-black">${game.achievements.length}/${ACHIEVEMENTS.length}</div>
                  </div>
                </div>
              </div>
              <button onclick="restartGame()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-xl">
                🔄 Play Again
              </button>
            </div>
          </div>
        ` : ''}
      `;
    }

    // ==================== INIT ====================
    game = createNewGame();
    game.availableProperties = generateMarket(6);
    render();
  </script>
</body>
</html>
